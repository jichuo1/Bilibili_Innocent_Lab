# Compiler Configuration
# 使用短 tmpdir，规避 Microsoft JDK 17.0.20 在长 TEMP 路径下 NIO 回环 AF_UNIX connect 被拒（Gradle 9.7 单次进程启动失败）
# properties 文件中反斜杠需转义：C:\Windows\Temp 写成 C:\\Windows\\Temp
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=C:\\Windows\\Temp
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
# Project Configuration
project.name=Bilibili_Innocent_Lab
project.android.compileSdk=37
project.android.minSdk=27
project.android.targetSdk=35
project.app.packageName=com.Bilibili_Innocent_Lab.xposedmodule
project.app.versionName="1.0.7"
project.app.versionCode=8
