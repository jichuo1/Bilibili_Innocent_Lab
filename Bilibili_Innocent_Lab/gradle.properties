# Compiler Configuration
# Windows 的短 tmpdir 由 gradlew.bat 按平台注入，避免把 Windows 路径传给 Linux CI。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.internal.instrumentation.agent=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Project Configuration
project.name=Bilibili_Innocent_Lab
project.android.compileSdk=37
project.android.minSdk=27
project.android.targetSdk=37
project.app.packageName=com.Bilibili_Innocent_Lab.xposedmodule
project.app.versionName="1.1.7"
# 改 versionCode 必须同步复核 ReleaseHighlightsCatalog.REVIEWED_VERSION_CODE：
# 发布公告是随 APK 内置的，门禁用两个数字不相等来强制人工过一遍新增设置有没有入口。
# 推送前自查（约 28 秒，不用跑完整门禁）：
#   ./gradlew.bat testDebugUnitTest --tests '*ReleaseHighlightsTest*' --no-daemon
project.app.versionCode=18
