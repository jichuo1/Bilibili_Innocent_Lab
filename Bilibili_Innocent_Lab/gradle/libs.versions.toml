material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
lumen-engine = { group = "com.github.jichuo1.LumenCoacervationEngine", name = "lumen-engine", version.ref = "lumen-engine" }
lumen-motion = { group = "com.github.jichuo1.LumenCoacervationEngine", name = "lumen-motion", version.ref = "lumen-engine" }
markwon-core = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
