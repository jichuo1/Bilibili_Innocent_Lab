meguviz-android-runtime = { group = "io.github.jichuo1.meguviz", name = "meguviz-android-runtime", version.ref = "meguviz-android" }
meguviz-android-window = { group = "io.github.jichuo1.meguviz", name = "meguviz-android-window", version.ref = "meguviz-android" }
dexkit = { group = "org.luckypray", name = "dexkit", version.ref = "dexkit" }
drawabletoolbox = { group = "com.github.duanhong169", name = "drawabletoolbox", version.ref = "drawabletoolbox" }
