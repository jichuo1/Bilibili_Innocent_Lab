[versions]
agp = "9.4.1"
kotlin = "2.4.21"
libxposed = "102.0.0"
meguviz-ref = "1.0.0"
meguviz-ui = "1.0.0"
meguviz-android = "1.1.0"
dexkit = "2.3.0"
drawabletoolbox = "1.0.7"
m3color = "2026.1"
androidx-core-ktx = "1.19.1"
androidx-appcompat = "1.8.0"
material = "1.14.0"
androidx-constraintlayout = "2.2.2"
androidx-recyclerview = "1.4.0"
# Pins for versions BetterAndroid used to select transitively; keep unchanged.
androidx-activity = "1.13.0"
androidx-collection = "1.6.0"
androidx-fragment = "1.9.0"
androidx-tracing = "2.0.0"
androidx-viewpager2 = "1.1.0"
androidx-viewpager = "1.1.0"
# Keep all Lumen modules on the same stable release (Maven Central, io.github.jichuo1).
lumen-engine = "1.6.1"
markwon = "4.6.2"
junit = "4.13.2"
androidx-test-junit = "1.3.0"
androidx-test-espresso-core = "3.7.0"
json = "20260814"
# P2-07 opt-in tooling (-PinnocentLab.baselineProfile=true); not resolved by default builds.
androidx-baselineprofile = "1.5.0"
androidx-benchmark-macro = "1.5.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[libraries]
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposed" }
