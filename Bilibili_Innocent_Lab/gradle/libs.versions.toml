[versions]
agp = "9.4.1"
kotlin = "2.4.21"
libxposed = "102.0.0"
meguviz-ref = "1.0.0"
meguviz-ui = "1.0.0"
betterandroid-ui-component = "1.1.6"
betterandroid-ui-component-adapter = "1.1.6"
betterandroid-ui-extension = "1.1.6"
betterandroid-system-extension = "1.1.6"
dexkit = "2.3.0"
m3color = "2026.1"
androidx-core-ktx = "1.19.1"
androidx-appcompat = "1.8.0"
material = "1.14.0"
androidx-constraintlayout = "2.2.2"
androidx-recyclerview = "1.4.0"
# Keep all Lumen modules on the same stable release.
lumen-engine = "1.5.6"
markwon = "4.6.2"
junit = "4.13.2"
androidx-test-junit = "1.3.0"
androidx-test-espresso-core = "3.7.0"
