[versions]
agp = "9.4.1"
kotlin = "2.4.21"
libxposed = "102.0.0"
meguviz-ref = "1.0.0"
meguviz-ui = "1.0.0"
meguviz-android = "1.0.0-rc.1"
dexkit = "2.3.0"
drawabletoolbox = "1.0.7"
m3color = "2026.1"
androidx-core-ktx = "1.19.1"
androidx-appcompat = "1.8.0"
material = "1.14.0"
androidx-constraintlayout = "2.2.2"
androidx-recyclerview = "1.4.0"
# Keep all Lumen modules on the same stable release.
lumen-engine = "1.5.6"
markwon = "4.6.2"
junit = "4.13.2"
androidx-test-junit = "1.3.0"
androidx-test-espresso-core = "3.7.0"
json = "20260814"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[libraries]
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposed" }
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "libxposed" }
meguviz-ref-core = { group = "io.github.jichuo1.meguviz", name = "meguviz-ref-core", version.ref = "meguviz-ref" }
meguviz-ui-core = { group = "io.github.jichuo1.meguviz", name = "meguviz-ui-core", version.ref = "meguviz-ui" }
meguviz-ui-prewarm = { group = "io.github.jichuo1.meguviz", name = "meguviz-ui-prewarm", version.ref = "meguviz-ui" }
meguviz-android-runtime = { group = "io.github.jichuo1.meguviz", name = "meguviz-android-runtime", version.ref = "meguviz-android" }
meguviz-android-window = { group = "io.github.jichuo1.meguviz", name = "meguviz-android-window", version.ref = "meguviz-android" }
dexkit = { group = "org.luckypray", name = "dexkit", version.ref = "dexkit" }
drawabletoolbox = { group = "com.github.duanhong169", name = "drawabletoolbox", version.ref = "drawabletoolbox" }
m3color = { group = "com.github.Kyant0", name = "m3color", version.ref = "m3color" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
