name: Build and upload Canary

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'README*'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: canary-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # compileSdk 与本地 gradle.properties 对齐到 37，消除"本地能过、CI 过不了"的分叉；
  # androidx.core 1.19.0 起 aar-metadata 要求 minCompileSdk=37。
  CI_COMPILE_SDK: '37'
  # sdkmanager 的包 id 带小版本号（platforms;android-37.2），与上面的 Gradle 属性不同名。
  CI_COMPILE_SDK_PACKAGE: 'platforms;android-37.2'
  CI_BUILD_TOOLS: '37.0.0'
  CI_GRADLE_JVMARGS: '-Xmx6144m -Dfile.encoding=UTF-8'
  JDK_JAVA_OPTIONS: '-XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+UseCodeCacheFlushing'

jobs:
  verify:
    name: Build, test and validate Release minification
    runs-on: ubuntu-latest
    # 防卡死的宽松上限（约为常规耗时的 6 倍以上），不是性能预算；默认值是 360 分钟。
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      base_version: ${{ steps.identity.outputs.base_version }}
      build_version_name: ${{ steps.identity.outputs.build_version_name }}
      version_code: ${{ steps.identity.outputs.version_code }}
      package_name: ${{ steps.identity.outputs.package_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          # 始终构建触发事件记录的精确提交，禁止 checkout 随分支移动而漂移。
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require the latest main source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Canary builds must be triggered from main; selected ref is $GITHUB_REF"
            exit 1
          fi

          checked_out_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          remote_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "Checked-out commit $checked_out_sha does not match event commit $GITHUB_SHA"
            exit 1
          fi
          if [[ "$remote_main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing stale build: event commit is $GITHUB_SHA but remote main is $remote_main_sha"
            echo "Push the intended source and trigger the latest main commit again."
            exit 1
          fi

          {
            echo "### Build source"
            echo "- Ref: \`$GITHUB_REF\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Subject: $(git log -1 --format=%s)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Canary build and delivery tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Bilibili_Innocent_Lab/build/reports/tooling
          python3 -m unittest discover -s .github/release-templates -p 'test_*.py' 2>&1 | tee Bilibili_Innocent_Lab/build/reports/tooling/unittest.log

      - name: Resolve source-controlled build identity
        id: identity
        shell: bash
        env:
          CANARY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 .github/release-templates/validate_canary_build.py \
            --gradle-properties Bilibili_Innocent_Lab/gradle.properties \
            --run-number "$CANARY_RUN_NUMBER" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '27'

      # R8 的构建缓存键包含输出文件名：未签名是 app-release-unsigned.apk，签名后是
      # app-release.apk。验证作业没有（也不该有）真实签名密钥，所以发布作业的 R8 键
      # 一直与验证作业不同，会把 R8 完整重跑一遍（约 80 秒）。这里生成一把只存在于本
      # 作业的一次性密钥，仅让输出文件名一致；它不签任何产物，门禁也不执行 packageRelease。
      - name: Create throwaway signing identity (R8 cache-key parity)
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/verify-throwaway.p12" -storetype PKCS12 \
            -alias throwaway -keyalg RSA -keysize 2048 -validity 2 \
            -storepass throwaway-r8 -keypass throwaway-r8 -dname "CN=throwaway"

      - name: Set up Gradle and restore build cache
        id: gradle-cache
        uses: ./.github/actions/gradle-cache

      - name: Probe exact Android SDK packages
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/release-templates/android_sdk_probe.py \
            --build-tools "$CI_BUILD_TOOLS" \
            --platform "${CI_COMPILE_SDK_PACKAGE#platforms;}" \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Set up Android SDK
        if: ${{ steps.sdk.outputs.ready != 'true' }}
        uses: android-actions/setup-android@v4.0.4
        with:
          # packages 默认值 "tools platform-tools" 会跑 `sdkmanager tools`，而 Google 已在
          # 2026-09-14 把废弃多年的 tools 包从 SDK 仓库下架，该调用直接 exit 1（Failed to
          # find package 'tools'），把整个 job 卡死在 setup 阶段。上游 v4.0.1 还没改这个
          # 默认值，只能在调用处覆盖。其余 SDK 包由下一步显式声明。
          cmdline-tools-version: '16111833'
          packages: platform-tools

      - name: Install Android SDK packages
        if: ${{ steps.sdk.outputs.ready != 'true' }}
        shell: bash
        run: sdkmanager "${CI_COMPILE_SDK_PACKAGE}" "build-tools;${CI_BUILD_TOOLS}"

      # 弹幕 wire 内核（libinnocent_danmaku_wire.so）由 CMake 在 Gradle 构建内调 cargo 编译；
      # rustup 从不预置，本步无条件执行。工具链代次必须与
      # Bilibili_Innocent_Lab/app/src/main/rust/danmaku-wire/rust-toolchain.toml 一致。
      - name: Install Rust toolchain (danmaku wire kernel)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.99.0
          . "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify installed Android SDK packages
        if: ${{ steps.sdk.outputs.ready != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/release-templates/android_sdk_probe.py \
            --build-tools "$CI_BUILD_TOOLS" \
            --platform "${CI_COMPILE_SDK_PACKAGE#platforms;}" \
            --github-env "$GITHUB_ENV" \
            --require-ready

      # One Gradle graph keeps behavior/contracts in the same complete report. Full lint runs in the
      # parallel `lint` job (android-lint.yml); this graph is every other gate task.
      # The helper preserves full Lint and R8, continues independent gates on failure,
      # and writes bounded task/report receipts without reusing a daemon.
      - name: Run complete Gradle verification
        id: build
        shell: bash
        env:
          INNOCENT_LAB_SIGNING_STORE_FILE: ${{ runner.temp }}/verify-throwaway.p12
          INNOCENT_LAB_SIGNING_STORE_PASSWORD: throwaway-r8
          INNOCENT_LAB_SIGNING_KEY_ALIAS: throwaway
          INNOCENT_LAB_SIGNING_KEY_PASSWORD: throwaway-r8
          EXPECTED_VERSION_NAME: ${{ steps.identity.outputs.build_version_name }}
        run: |
          set -euo pipefail
          python3 .github/release-templates/run_gradle_gates.py \
            --project-root Bilibili_Innocent_Lab \
            --partition build \
            --compile-sdk "$CI_COMPILE_SDK" \
            --release-version-name "$EXPECTED_VERSION_NAME" \
            --jvmargs="$CI_GRADLE_JVMARGS"

      - name: Collect complete verification evidence
        id: reports
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        working-directory: .
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python3 .github/release-templates/collect_verification_reports.py --partition build --build-outcome "$BUILD_OUTCOME"

      - name: Upload test reports
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verify-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: Bilibili_Innocent_Lab/build/verification-reports/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Save verified Gradle snapshot
        if: ${{ success() && github.repository == 'jichuo1/Bilibili_Innocent_Lab' && github.ref == 'refs/heads/main' && steps.build.outcome == 'success' && steps.reports.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.key }}

  # lint 与 verify 同时开始（不 needs verify），在另一台 runner 上跑完整 lint；
  # 发布前必须两者都成功。逻辑见 android-lint.yml 顶部的说明。
  lint:
    name: Full Android Lint
    permissions:
      contents: read
    uses: ./.github/workflows/android-lint.yml

  publish:
    name: Build signed Canary artifact
    needs: [verify, lint]
    if: ${{ needs.verify.result == 'success' && needs.lint.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      # 与 Alpha/Stable 复用同一长期证书；该环境只允许 main。
      name: alpha-release
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out source and release template
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require verified source remains latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          remote_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$remote_main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing stale publish: verified commit is $GITHUB_SHA but remote main is $remote_main_sha"
            echo "Run the workflow again from the latest main commit."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle and restore build cache
        id: gradle-cache
        uses: ./.github/actions/gradle-cache

      - name: Probe exact Android SDK packages
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/release-templates/android_sdk_probe.py \
            --build-tools "$CI_BUILD_TOOLS" \
            --platform "${CI_COMPILE_SDK_PACKAGE#platforms;}" \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Set up Android SDK
        if: ${{ steps.sdk.outputs.ready != 'true' }}
        uses: android-actions/setup-android@v4.0.4
        with:
          # packages 默认值 "tools platform-tools" 会跑 `sdkmanager tools`，而 Google 已在
          # 2026-09-14 把废弃多年的 tools 包从 SDK 仓库下架，该调用直接 exit 1（Failed to
          # find package 'tools'），把整个 job 卡死在 setup 阶段。上游 v4.0.1 还没改这个
          # 默认值，只能在调用处覆盖。其余 SDK 包由下一步显式声明。
          cmdline-tools-version: '16111833'
          packages: platform-tools

      - name: Install Android SDK packages
        if: ${{ steps.sdk.outputs.ready != 'true' }}
        shell: bash
        run: sdkmanager "${CI_COMPILE_SDK_PACKAGE}" "build-tools;${CI_BUILD_TOOLS}"

      # 弹幕 wire 内核（libinnocent_danmaku_wire.so）由 CMake 在 Gradle 构建内调 cargo 编译；
      # rustup 从不预置，本步无条件执行。工具链代次必须与
      # Bilibili_Innocent_Lab/app/src/main/rust/danmaku-wire/rust-toolchain.toml 一致。
      - name: Install Rust toolchain (danmaku wire kernel)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.99.0
          . "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify installed Android SDK packages
        if: ${{ steps.sdk.outputs.ready != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/release-templates/android_sdk_probe.py \
            --build-tools "$CI_BUILD_TOOLS" \
            --platform "${CI_COMPILE_SDK_PACKAGE#platforms;}" \
            --github-env "$GITHUB_ENV" \
            --require-ready

      - name: Restore fixed release signing identity
        id: signing
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEY_BASE64:?Missing ANDROID_SIGNING_KEY_BASE64 environment secret}"
          : "${SIGNING_STORE_PASSWORD:?Missing ANDROID_SIGNING_STORE_PASSWORD environment secret}"
          : "${SIGNING_KEY_ALIAS:?Missing ANDROID_SIGNING_KEY_ALIAS environment secret}"
          : "${SIGNING_KEY_PASSWORD:?Missing ANDROID_SIGNING_KEY_PASSWORD environment secret}"
          : "${EXPECTED_CERT_SHA256:?Missing ANDROID_SIGNING_CERT_SHA256 environment secret}"
          keystore="$RUNNER_TEMP/innocent-lab-release.p12"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"

      - name: Build signed Canary Release APK
        working-directory: Bilibili_Innocent_Lab
        shell: bash
        env:
          EXPECTED_VERSION_NAME: ${{ needs.verify.outputs.build_version_name }}
          INNOCENT_LAB_SIGNING_STORE_FILE: ${{ steps.signing.outputs.keystore }}
          INNOCENT_LAB_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          INNOCENT_LAB_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          INNOCENT_LAB_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew \
            "-Dorg.gradle.jvmargs=${CI_GRADLE_JVMARGS}" \
            "-Pproject.android.compileSdk=${CI_COMPILE_SDK}" \
            "-PinnocentLab.releaseVersionName=${EXPECTED_VERSION_NAME}" \
            assembleRelease \
            --console=plain --no-daemon

      - name: Verify signed Canary APK and generate provenance
        id: apk
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          BASE_VERSION: ${{ needs.verify.outputs.base_version }}
          EXPECTED_PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          EXPECTED_VERSION_NAME: ${{ needs.verify.outputs.build_version_name }}
          EXPECTED_VERSION_CODE: ${{ needs.verify.outputs.version_code }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="Bilibili_Innocent_Lab/app/build/outputs/apk/release/app-release.apk"
          aapt_bin="$ANDROID_SDK_ROOT/build-tools/$CI_BUILD_TOOLS/aapt"
          apksigner_bin="$ANDROID_SDK_ROOT/build-tools/$CI_BUILD_TOOLS/apksigner"
          python3 .github/release-templates/verify_release_apk.py \
            --apk "$apk" \
            --aapt "$aapt_bin" \
            --apksigner "$apksigner_bin" \
            --expected-package "$EXPECTED_PACKAGE_NAME" \
            --expected-version-name "$EXPECTED_VERSION_NAME" \
            --expected-version-code "$EXPECTED_VERSION_CODE" \
            --expected-cert-sha256 "$EXPECTED_CERT_SHA256" \
            --github-output "$GITHUB_OUTPUT"

          short_sha="${GITHUB_SHA:0:8}"
          apk_filename="Bilibili_Innocent_Lab-${RELEASE_TAG}-${short_sha}.apk"
          mkdir -p release-asset
          cp "$apk" "release-asset/$apk_filename"
          apk_sha256="$(sha256sum "release-asset/$apk_filename" | awk '{print $1}')"
          signer_sha256="$(sed -n 's/^apk_signer_certificate_sha256=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          mapping="Bilibili_Innocent_Lab/app/build/outputs/mapping/release/mapping.txt"
          test -s "$mapping"
          mapping_id="$(sed -n 's/^# pg_map_id: //p' "$mapping" | head -n 1)"
          if [[ ! "$mapping_id" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Release mapping has no valid pg_map_id: $mapping_id"
            exit 1
          fi
          mapping_sha256="$(sha256sum "$mapping" | awk '{print $1}')"
          mapping_filename="mapping-${RELEASE_TAG}-${short_sha}.txt"
          mkdir -p release-symbols
          cp "$mapping" "release-symbols/$mapping_filename"
          {
            printf 'release_channel=canary\n'
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'source_ref=%s\n' "$GITHUB_REF"
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'project_base_version=%s\n' "$BASE_VERSION"
            printf 'apk_package_name=%s\n' "$EXPECTED_PACKAGE_NAME"
            printf 'apk_version_name=%s\n' "$EXPECTED_VERSION_NAME"
            printf 'apk_version_code=%s\n' "$EXPECTED_VERSION_CODE"
            printf 'apk_build_type=release\n'
            printf 'apk_debuggable=false\n'
            printf 'apk_signer_certificate_sha256=%s\n' "$signer_sha256"
            printf 'apk_filename=%s\n' "$apk_filename"
            printf 'apk_sha256=%s\n' "$apk_sha256"
            printf 'r8_mapping_id=%s\n' "$mapping_id"
            printf 'r8_mapping_sha256=%s\n' "$mapping_sha256"
            printf 'r8_mapping_artifact=%s\n' "$mapping_filename"
          } > release-asset/BUILD_INFO.txt
          (
            cd release-asset
            sha256sum "$apk_filename" BUILD_INFO.txt > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          echo "source_short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$apk_filename" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified signed Canary APK"
            echo "- File: \`$apk_filename\`"
            echo "- versionName: \`$EXPECTED_VERSION_NAME\`"
            echo "- versionCode: \`$EXPECTED_VERSION_CODE\`"
            echo "- Certificate SHA-256: \`$signer_sha256\`"
            echo "- APK SHA-256: \`$apk_sha256\`"
            echo "- R8 mapping ID: \`$mapping_id\`"
            echo "- R8 mapping SHA-256: \`$mapping_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Canary build notes
        env:
          BUILD_TAG: ${{ needs.verify.outputs.release_tag }}
          PREVIOUS_COMMIT: ${{ github.event.before }}
        run: |
          python3 .github/release-templates/generate_canary_notes.py \
            --repo-root . --tag "$BUILD_TAG" --commit "$GITHUB_SHA" \
            --before "$PREVIOUS_COMMIT" --output release-asset/CANARY_CHANGELOG.md

      - name: Upload verified signed Canary package
        id: canary_artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Bilibili_Innocent_Lab-${{ needs.verify.outputs.release_tag }}-${{ steps.apk.outputs.source_short_sha }}
          path: release-asset
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Read back uploaded Canary package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.canary_artifact.outputs.artifact-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          archive="$RUNNER_TEMP/canary-uploaded.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$archive"
          python3 .github/release-templates/verify_canary_artifact.py --archive "$archive" --directory release-asset

      - name: Upload Canary R8 symbols
        uses: actions/upload-artifact@v7.0.2
        with:
          name: canary-release-symbols-${{ github.sha }}
          path: release-symbols
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Remove temporary signing keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/innocent-lab-release.p12"
